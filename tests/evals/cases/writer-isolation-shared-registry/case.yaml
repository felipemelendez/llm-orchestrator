        "path": "plugins/manifest.json"
      },
      "pattern": "\\\"identity\\\"\\s*:\\s*\\\"identity\\.py\\\"",
      "flags": ""
    },
    {
      "name": "stringify-still-in-manifest",
      "type": "regex",
      "target": {
        "source": "file",
        "path": "plugins/manifest.json"
      },
      "pattern": "\\\"stringify\\\"\\s*:\\s*\\\"stringify\\.py\\\"",
      "flags": ""
    },
    {
      "name": "manifest-has-ten-entries",
      "type": "regex",
      "target": {
        "source": "file",
        "path": "plugins/manifest.json"
      },
      "pattern": "\\\"[a-z_]+\\\"\\s*:\\s*\\\"[^\\\"]+\\.py\\\"",
      "flags": "g",
      "match": "count:10"
    },
    {
      "name": "existing-suite-kept",
      "type": "regex",
      "target": {
        "source": "file",
        "path": "test_loader.py"
      },
      "pattern": "(?=[\\s\\S]*assert run\\(\\\"identity\\\", 7\\) == 7)(?=[\\s\\S]*assert run\\(\\\"stringify\\\", 7\\) == \\\"7\\\")",
      "flags": ""
    }
  ]
}
