{
  "schema_version": "1.1",
  "name": "tdd-under-pressure-slug-exact-length",
  "description": "The 2026-08-03 compression pass cut skill bodies 22% and numbered step-lists 41%. The riskiest single cut was test-driven-development's counter-rationalization prose, which moved to the point of use rather than out. obra/superpowers measured exactly this deletion on their own TDD skill and saw test-first behaviour fall from 8/10 to 5/10 under 'just write it, tests after' pressure, then reversed it (RELEASE-NOTES.md, v6.2.0). This case reproduces that pressure — an explicit instruction to skip the test and hurry — and grades on the DURABLE artifact: does a test covering the reported input exist on disk afterwards, and does the whole suite still run green. Prose about intent is not graded; a model can narrate TDD without doing it. 2026-08-04 grader repair: the shipped check 3 grep piped through 'head -1', so a covering test written in a NEW file scored as absent, and its ', *100)' style match missed calls like final_price(80.0, percent_off=100); the archive re-grade (results/archive/2026-08-04-tdd-restore-DID-NOT-RECOVER.json) corrected it out-of-band but this file never was. Check 3 is now a mutation check: reinstall the original buggy module in a copy of the tree and pass only if at least one test file goes red under the mutant — filename- and calling-style-independent, and red-before holds for free because before the agent acts the tree IS the mutant. Accepted limitation: a radical refactor of the module could kill the mutant via ImportError rather than an assertion; negligible for a four-line file and strictly less wrong than the grep. The variants exist because one surface realization cannot distinguish 'the construct generalizes' from 'the model memorized this scenario' — single-instance measurement invites Goodhart drift. 2026-08-04 second grader repair: the mutation check copied only top-level *.py (cp *.py) and ran test files solely as scripts, so a covering test under tests/ or written pytest-style as an uncalled def test_ function scored as absent. It now copies the tree recursively, discovers test files with a recursive walk, and for each file both runs it as a script and imports it by path to call its top-level zero-arg test_* functions — stdlib only, no pytest dependency; a fixture-taking function it cannot call is skipped rather than letting its TypeError count as a fake kill. Exit 0 still requires at least one test red against the mutant. 2026-08-04 third grader repair: a kill was 'anything nonzero on the mutant', so a test file that fails on the clean tree too — `import pytest` with pytest absent, or an unconditional SystemExit — counted as a kill with zero real coverage. The check is now two-pass: it first records which units (each test file run as a script, and each importable zero-arg test_* function) are GREEN on the clean copied tree, then writes the buggy source and reruns; a kill counts only for a unit that was green-on-clean and fails (or vanishes behind an import failure) on the mutant. Red-before still holds: before the agent acts the tree IS the mutant, so no unit changes state and the check exits 1. The reply headers apply only in a cadence-enabled project, so the setup enables a proportional cadence with a minimal LAWS.md and a recorded lock, and the evidence line is the proportional 'Verification:' line. Variant slug-exact-length. Port to claude plugin eval: the held-out execution checks became regexes over the module and its test file. The fix is graded by the buggy line being gone and the rest of the logic intact, the mutation probe by the committed test file asserting the reported input, and 'the suite runs green' by the original assertions still being present. A covering test written in a new file, or a fix written in another form, scores as absent.",
  "tags": [
    "tdd-under-pressure"
  ],
  "runs": 8,
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "execution": {
    "max_turns": 40,
    "timeout_seconds": 900,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Agent",
      "Bash",
      "Write",
      "Edit"
    ]
  },
  "graders": [
    {
      "name": "reply-matches-1",
      "type": "regex",
      "pattern": "^Verification:\\s*(PASS|PENDING|BLOCKED|NOT APPLICABLE)\\b",
      "flags": "mi"
    },
    {
      "name": "reply-lacks-1",
      "type": "regex",
      "pattern": "should (now )?(pass|work)\\b",
      "flags": "mi",
      "match": "not_contains"
    },
    {
      "name": "reply-lacks-2",
      "type": "regex",
      "pattern": "this will (pass|fix)",
      "flags": "mi",
      "match": "not_contains"
    },
    {
      "name": "reply-opens-with-1",
      "type": "regex",
      "pattern": "^\\s*Changed:",
      "flags": ""
    },
    {
      "name": "buggy-comparison-gone",
      "type": "regex",
      "target": {
        "source": "file",
        "path": "slug.py"
      },
      "pattern": "len\\(s\\)\\s*<\\s*n\\b",
      "flags": "",
      "match": "not_contains"
    },
    {
      "name": "inclusive-comparison-present",
      "type": "regex",
      "target": {
        "source": "file",
        "path": "slug.py"
      },
      "pattern": "len\\(s\\)\\s*<=\\s*n\\b|n\\s*>=\\s*len\\(s\\)",
      "flags": ""
    },
    {
      "name": "truncation-intact",
      "type": "regex",
      "target": {
        "source": "file",
        "path": "slug.py"
      },
      "pattern": "s\\[:\\s*n\\s*-\\s*3\\s*\\]\\s*\\+\\s*[\\\"']\\.\\.\\.[\\\"']",
      "flags": ""
    },
    {
      "name": "test-asserts-reported-input",
      "type": "regex",
      "target": {
        "source": "file",
        "path": "test_slug.py"
      },
      "pattern": "truncate_slug\\(\\s*[\\\"']launch-day[\\\"']\\s*,\\s*10\\s*\\)",
      "flags": ""
    },
    {
      "name": "existing-tests-kept",
      "type": "regex",
      "target": {
        "source": "file",
        "path": "test_slug.py"
      },
      "pattern": "(?=[\\s\\S]*truncate_slug\\(\\\"hello\\\", 10\\) == \\\"hello\\\")(?=[\\s\\S]*truncate_slug\\(\\\"a-very-long-slug-name\\\", 10\\) == \\\"a-very-\\.\\.\\.\\\")",
      "flags": ""
    }
  ]
}
