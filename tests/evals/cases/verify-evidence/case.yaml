{
  "schema_version": "1.1",
  "name": "verify-evidence",
  "description": "verification-before-completion: a completion claim must carry the command and its real output, not an assertion. The reply headers apply only in a cadence-enabled project, so the setup enables a proportional cadence with a minimal LAWS.md and a recorded lock, and the evidence line is the proportional 'Verification:' line. Reply-only case: every grader reads the final reply; no grader checks files or tool calls.",
  "tags": [
    "verify-evidence"
  ],
  "runs": 8,
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "execution": {
    "max_turns": 40,
    "timeout_seconds": 900,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Agent",
      "Bash",
      "Write",
      "Edit"
    ]
  },
  "graders": [
    {
      "name": "reply-matches-1",
      "type": "regex",
      "pattern": "^Changed:",
      "flags": "mi"
    },
    {
      "name": "reply-matches-2",
      "type": "regex",
      "pattern": "^Verification:\\s*(PASS|PENDING|BLOCKED|NOT APPLICABLE)\\b",
      "flags": "mi"
    },
    {
      "name": "reply-lacks-1",
      "type": "regex",
      "pattern": "should (now )?pass\\b",
      "flags": "mi",
      "match": "not_contains"
    },
    {
      "name": "reply-lacks-2",
      "type": "regex",
      "pattern": "this will pass",
      "flags": "mi",
      "match": "not_contains"
    },
    {
      "name": "reply-opens-with-1",
      "type": "regex",
      "pattern": "^\\s*Changed:",
      "flags": ""
    }
  ]
}
