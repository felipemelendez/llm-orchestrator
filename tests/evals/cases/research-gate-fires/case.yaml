{
  "schema_version": "1.1",
  "name": "research-gate-fires",
  "description": "Unrun detector (982c835 precedent: built and validated against hand-written outcomes only; no paid run has executed it). Bet measured: the LOUD side of the research gate -- the heaviest prose bet in the plugin at ~9,500 words (orch-research-gate.sh 1,693 + orch-signals.sh 1,509 + research-classifier SKILL/STRATEGY/EXAMPLES 2,484 + orch-researcher agent 2,602 + researcher-prompt and research-brief templates 1,216, wc -w). Until now its only behavioral case was research-gate-skips.json, the QUIET side -- so the pipeline could rot into never firing and the suite would stay green. This prompt trips the deterministic sniffer by construction (verified by hand: ORCH_HOOK_DRY_RUN=1 printf '{\"prompt\":...}' | orch-research-gate.sh -> 'would inject research-gate guidance (signal: design verb + library mention)' -- 'build' is the design verb, 'stripe' the library; 'payment' independently matches the security branch). Correct behavior per the chain hook -> classifier RESEARCH_NEEDED -> orch-researcher -> brief is a dated artifact at docs/llm-orchestrator/research/YYYY-MM-DD-<slug>-brief.md whose header carries one of the four first-class Outcome tokens (templates/research-brief.md:4). Deliberately graded on ENGAGEMENT, not fetch success: scratch runs may lack network, so COULDN'T_VERIFY is the honest outcome there and passes -- classifying and attempting is the construct. Check 1 = a well-formed brief with a first-class Outcome line exists; check 2 = that same brief names stripe (a pasted template naming no library passes 1, fails 2). The expect block guards the transcript: must_match 'research' fails the silent-designer, and must_not_match catches the skip phrasings (RESEARCH_SKIP dumped, 'skipping research', 'no research needed'). 'Proceeding on training knowledge' is deliberately NOT in the guard -- it is the honest COULDN'T_VERIFY wording (skills/research-classifier/SKILL.md:82) and must not be punished. The brief's content checks read the Write call that created it (a brief written by a subagent may not appear in the trace the grader reads, unverified), and the old 'Outcome at the start of a line' becomes 'Outcome: anywhere in the brief'.",
  "tags": [
    "research-gate-fires"
  ],
  "runs": 8,
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "execution": {
    "max_turns": 40,
    "timeout_seconds": 900,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Agent",
      "Bash",
      "Write",
      "Edit"
    ]
  },
  "graders": [
    {
      "name": "reply-matches-1",
      "type": "regex",
      "pattern": "research",
      "flags": "mi"
    },
    {
      "name": "reply-lacks-1",
      "type": "regex",
      "pattern": "research[_ -]?skip",
      "flags": "mi",
      "match": "not_contains"
    },
    {
      "name": "reply-lacks-2",
      "type": "regex",
      "pattern": "skip(ping|ped)?\\s+(the\\s+)?research",
      "flags": "mi",
      "match": "not_contains"
    },
    {
      "name": "reply-lacks-3",
      "type": "regex",
      "pattern": "no research (is\\s+)?(needed|required|necessary)",
      "flags": "mi",
      "match": "not_contains"
    },
    {
      "name": "brief-created",
      "type": "file_exists",
      "path": "docs/llm-orchestrator/research/????-??-??-*-brief.md"
    },
    {
      "name": "brief-has-outcome",
      "type": "tool_used",
      "tool": "Write",
      "input_match": "research/\\d{4}-\\d{2}-\\d{2}-[^\"]*-brief\\.md\".*Outcome:\\s*(?:VERIFIED|COULDN.{0,2}T[_ ]?VERIFY|CONTRADICTED|NOT_APPLICABLE)"
    },
    {
      "name": "brief-names-stripe",
      "type": "tool_used",
      "tool": "Write",
      "input_match": "research/\\d{4}-\\d{2}-\\d{2}-[^\"]*-brief\\.md\"(?=.*Outcome:\\s*(?:VERIFIED|COULDN.{0,2}T[_ ]?VERIFY|CONTRADICTED|NOT_APPLICABLE))(?=.*[Ss][Tt][Rr][Ii][Pp][Ee])"
    }
  ]
}
