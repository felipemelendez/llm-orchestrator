name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # A suite that cannot run because a dependency is missing must FAIL here,
      # not skip: CI is the instrument every other claim is measured on, and a
      # runner image that silently lost python3 or perl would otherwise turn
      # six guard/gate suites into no-ops that still report green.
      ORCH_REQUIRE_DEPS: "1"
      # The latency budgets are calibrated on a dedicated laptop. A shared
      # 2-vCPU runner measures the runner, not the hooks, so CI gets a looser
      # bound that still catches a real regression (an unbounded hook is
      # seconds, not tens of milliseconds). Local runs keep 500/1200.
      ORCH_LATENCY_BUDGET_MS: "800"
      ORCH_SESSION_LATENCY_BUDGET_MS: "1800"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check server.cjs syntax
        if: always()
        run: node --check skills/brainstorming/scripts/server.cjs

      # One step, every suite, DISCOVERED rather than enumerated.
      #
      # This used to be 23 hand-written steps, and the list had drifted: ten
      # suites were never run by CI at all — the writer-mutex modes, the retry
      # cap, telemetry, detect, hook latency, and all three handoff suites —
      # while CI reported green across the board. Adding the missing ten would
      # have fixed today's gap and left the mechanism that produced it, so the
      # enumeration is gone instead. tests/run-all.sh globs the suites, prints
      # any deliberate exclusion with its reason, and fails with the names of
      # the suites that broke. Adding a test file is now enough to have it run.
      #
      # It runs on Linux here and on macOS locally on purpose: several defects
      # in the guard and worktree code were BSD-vs-GNU differences that passed
      # silently on one platform.
      - name: Run every test suite
        if: always()
        run: bash tests/run-all.sh
